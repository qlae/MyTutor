<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Tutor RL Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --brand:#2563eb; --bg:#f8fafc; --card:#ffffff; --muted:#64748b; }
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial; background:var(--bg); margin:0; }
    .wrap { max-width: 880px; margin: 40px auto; padding: 24px; }
    .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(15,23,42,.08); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: var(--muted); margin:0 0 16px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    select, button {
      padding: 10px 14px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 15px;
    }
    button { background: var(--brand); color: white; border: none; cursor: pointer; }
    .step { display:none; }
    .active { display:block; animation: fade .2s ease-in; }
    @keyframes fade { from { opacity: .6; transform: translateY(4px);} to { opacity:1; transform:none; } }
    .q { padding:12px 14px; border-radius:10px; background:#f1f5f9; margin:10px 0; }
    .hint { background:#fff7ed; border-left:4px solid #fed7aa; padding:10px 12px; border-radius: 8px; margin:8px 0; }
    .kpi { display:flex; gap:16px; flex-wrap:wrap; margin:10px 0 4px; }
    .pill { background:#e2e8f0; padding:6px 10px; border-radius:999px; font-size:13px; color:#0f172a; }
    .footer { color: var(--muted); font-size: 13px; margin-top: 8px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🎓 Smart Tutor (RL)</h1>
      <p class="sub">Personalized quizzes that adapt difficulty using Q-learning.</p>

      <div class="step active" id="s1">
        <div class="row">
          <select id="subject"></select>
          <button id="startBtn">Start Diagnostic</button>
        </div>
      </div>

      <div class="step" id="s2">
        <h3>Diagnostic</h3>
        <form id="diagForm"></form>
        <button id="diagNext">Continue</button>
      </div>

      <div class="step" id="s3">
        <h3>Quiz</h3>
        <div class="pill" id="diffPill"></div>
        <form id="quizForm"></form>
        <button id="quizSubmit">Submit</button>
      </div>

      <div class="step" id="s4">
        <h3>Results</h3>
        <div id="results"></div>
        <div id="hintsSection"></div>
        <div class="kpi" id="kpis"></div>
        <button id="nextQuizBtn">Next Quiz</button>
        <div class="footer">Agent exploration gradually decays to favor mastery.</div>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
